    "ar": {"baslik": "الاتصال بـ In1", "bilgisayar": "تطبيق على هذا الحاسوب", "istiyor": "{k}: طلب اتصال بحساب In1.", "adim1": "فتح In1 على الهاتف.", "adim2": "في «مدرب ذكي»: الضغط على اسم الذكاء الاصطناعي ثم «طريقة الاتصال».", "adim3": "كتابة الرمز أدناه ثم السماح.", "sure": "الرمز صالح لمدة {s} أخرى. بعد السماح تعود هذه الصفحة تلقائياً.", "uyari": "إذا فُتحت هذه الصفحة من طرف آخر فلا يُكتب الرمز في أي مكان. In1 لا يطلب هذا الرمز برسالة أو باتصال هاتفي.", "bilgi": "الذكاء الاصطناعي المتصل يطّلع على قائمة التمارين وقائمة الأطعمة ويترك اقتراحات برامج ووصفات وخطط غذائية وأهداف للماكروز. لا يستطيع تغيير السجلات، ولا يتحول الاقتراح إلى شيء قبل إضافته في التطبيق. لا يقرأ إلا المعلومات المسموح بها على حدة لهذا الاتصال في التطبيق (معلومات التغذية، ملخصات التمارين، قياسات الجسم، متابعة الماكروز، الوصفات، الأطعمة الخاصة، توزيع العضلات، سجل التمارين، الجنس والعمر والطول والوزن، الهدف والخبرة والمكان والمعدات، معلومات الألم والإصابات: لكل منها مفتاح مستقل، وكلها مغلقة في البداية). يمكن قطع الاتصال من التطبيق في أي وقت. يتطلب Premium.", "donuyor": "تم. جارٍ العودة إلى الذكاء الاصطناعي…", "sureDoldu": "انتهت صلاحية الرمز. يجب بدء اتصال In1 من جديد في الذكاء الاصطناعي.", "bitti": "اكتمل طلب الاتصال هذا. يمكن إغلاق الصفحة.", "yok": "طلب الاتصال غير موجود أو انتهت صلاحيته. يجب بدء اتصال In1 من جديد في الذكاء الاصطناعي.", "hata": "تعذّر فتح طلب الاتصال هذا. In1 يتصل حالياً مع Claude و ChatGPT فقط.", "agYok": "تعذّر الوصول إلى الخادم، تجري إعادة المحاولة…", "gizlilik": "سياسة الخصوصية"},
    "ru": {"baslik": "Подключение к In1", "bilgisayar": "Приложение на этом компьютере", "istiyor": "{k} хочет подключиться к вашему аккаунту In1.", "adim1": "Откройте In1 на телефоне.", "adim2": "В разделе «ИИ тренер» нажмите на название своего ИИ, затем «Как подключить».", "adim3": "Введите код ниже и разрешите доступ.", "sure": "Код действует ещё {s}. Когда вы разрешите доступ, эта страница вернётся сама.", "uyari": "Если вы не открывали эту страницу сами, никуда не вводите код. In1 никогда не просит этот код в сообщении или по телефону.", "bilgi": "Подключённый ИИ видит списки упражнений и продуктов и оставляет вам предложения программ, рецептов, планов питания и целей по макросам. Изменить ваши записи он не может; предложение ничем не становится, пока вы не добавите его в приложении. Он читает только те сведения, которые вы отдельно разрешите для этого подключения в приложении (сведения о питании, сводки тренировок, замеры тела, учёт макросов, рецепты, свои продукты, распределение по мышцам, история упражнений, пол-возраст-рост-вес, цель-опыт-место-оборудование, сведения о болях и травмах: у каждого свой переключатель, вначале все выключены). Отключить подключение можно в приложении в любой момент. Требуется Premium.", "donuyor": "Готово. Возвращаемся к вашему ИИ…", "sureDoldu": "Срок действия кода истёк. Запустите подключение In1 в своём ИИ заново.", "bitti": "Этот запрос на подключение завершён. Страницу можно закрыть.", "yok": "Запрос на подключение не найден или его срок истёк. Запустите подключение In1 в своём ИИ заново.", "hata": "Не удалось открыть этот запрос на подключение. Пока In1 подключается только к Claude и ChatGPT.", "agYok": "Сервер недоступен, повторная попытка…", "gizlilik": "Политика конфиденциальности"},
    "uk": {"baslik": "Підключення до In1", "bilgisayar": "Застосунок на цьому комп'ютері", "istiyor": "{k} хоче підключитися до вашого облікового запису In1.", "adim1": "Відкрийте In1 на телефоні.", "adim2": "У розділі «ШІ тренер» натисніть назву свого ШІ, потім «Як підключити».", "adim3": "Введіть код нижче й дозвольте доступ.", "sure": "Код дійсний ще {s}. Коли ви дозволите доступ, ця сторінка повернеться сама.", "uyari": "Якщо ви не відкривали цю сторінку самі, нікуди не вводьте код. In1 ніколи не просить цей код у повідомленні чи телефоном.", "bilgi": "Підключений ШІ бачить списки вправ і продуктів та залишає вам пропозиції програм, рецептів, планів харчування й цілей макросів. Змінити ваші записи він не може; пропозиція нічим не стає, доки ви не додасте її в застосунку. Він читає лише ті відомості, які ви окремо дозволите для цього підключення в застосунку (відомості про харчування, зведення тренувань, заміри тіла, облік макросів, рецепти, власні продукти, розподіл за м'язами, історія вправ, стать-вік-зріст-вага, мета-досвід-місце-обладнання, відомості про біль і травми: у кожного свій перемикач, спочатку всі вимкнені). Від'єднати підключення можна в застосунку будь-коли. Потрібен Premium.", "donuyor": "Готово. Повертаємося до вашого ШІ…", "sureDoldu": "Термін дії коду минув. Запустіть підключення In1 у своєму ШІ знову.", "bitti": "Цей запит на підключення завершено. Сторінку можна закрити.", "yok": "Запит на підключення не знайдено або його термін минув. Запустіть підключення In1 у своєму ШІ знову.", "hata": "Не вдалося відкрити цей запит на підключення. Поки що In1 підключається лише до Claude і ChatGPT.", "agYok": "Сервер недоступний, повторна спроба…", "gizlilik": "Політика конфіденційності"},
    "ro": {"baslik": "Conectare la In1", "bilgisayar": "O aplicație de pe acest computer", "istiyor": "{k} dorește să se conecteze la contul dvs. In1.", "adim1": "Deschideți In1 pe telefon.", "adim2": "În Antrenor AI, atingeți numele AI-ului dvs., apoi „Cum se conectează”.", "adim3": "Introduceți codul de mai jos și permiteți accesul.", "sure": "Codul mai este valabil {s}. După ce permiteți, această pagină revine singură.", "uyari": "Dacă nu ați deschis dvs. această pagină, nu introduceți codul nicăieri. In1 nu cere niciodată acest cod prin mesaj sau telefon.", "bilgi": "AI-ul conectat vede listele de exerciții și de alimente și vă lasă sugestii de programe, rețete, planuri alimentare și obiective de macronutrienți. Nu vă poate modifica înregistrările; o sugestie nu devine nimic până nu o adăugați în aplicație. Citește doar informațiile pe care le permiteți separat pentru această conexiune în aplicație (informații despre alimentație, rezumate ale antrenamentelor, măsurători corporale, urmărirea macronutrienților, rețete, alimente proprii, distribuția musculară, istoricul exercițiilor, sex-vârstă-înălțime-greutate, obiectiv-experiență-loc-echipament, informații despre dureri și accidentări: fiecare cu propriul comutator, toate oprite la început). Puteți întrerupe conexiunea din aplicație oricând. Este necesar Premium.", "donuyor": "Gata. Se revine la AI-ul dvs.…", "sureDoldu": "Codul a expirat. Porniți din nou conexiunea In1 în AI-ul dvs.", "bitti": "Această cerere de conectare s-a încheiat. Puteți închide pagina.", "yok": "Cererea de conectare nu a fost găsită sau a expirat. Porniți din nou conexiunea In1 în AI-ul dvs.", "hata": "Această cerere de conectare nu a putut fi deschisă. Deocamdată In1 se conectează doar cu Claude și ChatGPT.", "agYok": "Serverul nu poate fi contactat, se reîncearcă…", "gizlilik": "Politica de confidențialitate"},
    "pl": {"baslik": "Połącz z In1", "bilgisayar": "Aplikacja na tym komputerze", "istiyor": "{k} chce połączyć się z twoim kontem In1.", "adim1": "Otwórz In1 na telefonie.", "adim2": "W sekcji Trener AI dotknij nazwy swojej AI, a potem „Jak połączyć”.", "adim3": "Wpisz poniższy kod i zezwól.", "sure": "Kod jest ważny jeszcze przez {s}. Gdy zezwolisz, ta strona wróci sama.", "uyari": "Jeśli ta strona nie została otwarta przez ciebie, nigdzie nie wpisuj kodu. In1 nigdy nie prosi o ten kod w wiadomości ani przez telefon.", "bilgi": "Połączona AI widzi listy ćwiczeń i produktów oraz zostawia ci propozycje programów, przepisów, planów żywieniowych i celów makro. Nie może zmieniać twoich zapisów; propozycja niczym się nie staje, dopóki nie dodasz jej w aplikacji. Odczytuje tylko informacje, na które osobno zezwolisz dla tego połączenia w aplikacji (informacje o żywieniu, podsumowania treningów, pomiary ciała, śledzenie makro, przepisy, własne produkty, podział na mięśnie, historia ćwiczeń, płeć-wiek-wzrost-waga, cel-doświadczenie-miejsce-sprzęt, informacje o bólu i kontuzjach: każda ma własny przełącznik, na początku wszystkie są wyłączone). Połączenie możesz w każdej chwili przerwać w aplikacji. Wymagane jest Premium.", "donuyor": "Gotowe. Wracamy do twojej AI…", "sureDoldu": "Kod wygasł. Rozpocznij ponownie połączenie z In1 w swojej AI.", "bitti": "Ta prośba o połączenie została zakończona. Możesz zamknąć stronę.", "yok": "Nie znaleziono prośby o połączenie albo wygasła. Rozpocznij ponownie połączenie z In1 w swojej AI.", "hata": "Nie udało się otworzyć tej prośby o połączenie. Na razie In1 łączy się tylko z Claude i ChatGPT.", "agYok": "Brak połączenia z serwerem, ponawianie…", "gizlilik": "Polityka prywatności"},
    "bg": {"baslik": "Свързване с In1", "bilgisayar": "Приложение на този компютър", "istiyor": "{k} иска да се свърже с вашия профил в In1.", "adim1": "Отворете In1 на телефона си.", "adim2": "В „ИИ треньор“ докоснете името на вашия ИИ, след това „Как да се свържете“.", "adim3": "Въведете кода по-долу и разрешете.", "sure": "Кодът е валиден още {s}. Щом разрешите, тази страница ще се върне сама.", "uyari": "Ако не сте отворили тази страница сами, не въвеждайте кода никъде. In1 никога не иска този код със съобщение или по телефона.", "bilgi": "Свързаният ИИ вижда списъците с упражнения и храни и ви оставя предложения за програми, рецепти, хранителни планове и цели за макроси. Не може да променя записите ви; предложението не се превръща в нищо, докато не го добавите в приложението. Чете само данните, които разрешите отделно за тази връзка в приложението (данни за храненето, обобщения на тренировките, телесни мерки, проследяване на макросите, рецепти, собствени храни, разпределение по мускули, история на упражненията, пол-възраст-ръст-тегло, цел-опит-място-уреди, данни за болки и травми: всяко със собствен превключвател, в началото всички са изключени). Можете да прекъснете връзката от приложението по всяко време. Изисква се Premium.", "donuyor": "Готово. Връщане към вашия ИИ…", "sureDoldu": "Кодът е изтекъл. Започнете отново свързването с In1 във вашия ИИ.", "bitti": "Тази заявка за свързване е завършена. Можете да затворите страницата.", "yok": "Заявката за свързване не е намерена или е изтекла. Започнете отново свързването с In1 във вашия ИИ.", "hata": "Тази заявка за свързване не можа да бъде отворена. Засега In1 се свързва само с Claude и ChatGPT.", "agYok": "Няма връзка със сървъра, опитва се отново…", "gizlilik": "Политика за поверителност"},
    "cs": {"baslik": "Připojení k In1", "bilgisayar": "Aplikace v tomto počítači", "istiyor": "{k} se chce připojit k vašemu účtu In1.", "adim1": "Otevřete In1 v telefonu.", "adim2": "V sekci AI trenér klepněte na název své AI a potom na „Jak připojit“.", "adim3": "Zadejte kód níže a povolte přístup.", "sure": "Kód platí ještě {s}. Jakmile přístup povolíte, tato stránka se sama vrátí.", "uyari": "Pokud jste tuto stránku neotevřeli sami, kód nikam nezadávejte. In1 tento kód nikdy nežádá zprávou ani telefonicky.", "bilgi": "Připojená AI vidí seznam cviků a potravin a nechává vám návrhy programů, receptů, jídelníčků a cílů makroživin. Vaše záznamy měnit nemůže; z návrhu se nic nestane, dokud ho v aplikaci nepřidáte. Čte jen údaje, které pro toto připojení v aplikaci zvlášť povolíte (údaje o výživě, souhrny tréninků, tělesné míry, sledování makroživin, recepty, vlastní potraviny, rozložení svalů, historie cviků, pohlaví-věk-výška-váha, cíl-zkušenosti-místo-vybavení, údaje o bolesti a zraněních: každý má vlastní přepínač, na začátku jsou všechny vypnuté). Připojení můžete v aplikaci kdykoli zrušit. Je potřeba Premium.", "donuyor": "Hotovo. Vracíme se k vaší AI…", "sureDoldu": "Platnost kódu vypršela. Spusťte připojení k In1 ve své AI znovu.", "bitti": "Tato žádost o připojení je dokončena. Stránku můžete zavřít.", "yok": "Žádost o připojení nebyla nalezena nebo vypršela. Spusťte připojení k In1 ve své AI znovu.", "hata": "Tuto žádost o připojení se nepodařilo otevřít. In1 se zatím připojuje jen ke Claude a ChatGPT.", "agYok": "Server je nedostupný, zkouší se to znovu…", "gizlilik": "Zásady ochrany osobních údajů"},
    "hr": {"baslik": "Povezivanje s In1", "bilgisayar": "Aplikacija na ovom računalu", "istiyor": "{k} želi se povezati s vašim In1 računom.", "adim1": "Otvorite In1 na telefonu.", "adim2": "U odjeljku AI trener dodirnite naziv svojeg AI-ja, zatim „Kako povezati“.", "adim3": "Upišite kod u nastavku i dopustite pristup.", "sure": "Kod vrijedi još {s}. Kad dopustite, ova se stranica sama vraća.", "uyari": "Ako ovu stranicu niste sami otvorili, kod ne upisujte nigdje. In1 nikad ne traži ovaj kod porukom ni telefonom.", "bilgi": "Povezani AI vidi popise vježbi i namirnica i ostavlja vam prijedloge programa, recepata, jelovnika i ciljeva makronutrijenata. Ne može mijenjati vaše zapise; prijedlog ne postaje ništa dok ga ne dodate u aplikaciji. Čita samo podatke koje zasebno dopustite za ovu vezu u aplikaciji (podaci o prehrani, sažeci treninga, tjelesne mjere, praćenje makronutrijenata, recepti, vlastite namirnice, raspodjela po mišićima, povijest vježbi, spol-dob-visina-težina, cilj-iskustvo-mjesto-oprema, podaci o bolovima i ozljedama: svaki ima svoj prekidač, na početku su svi isključeni). Vezu možete prekinuti u aplikaciji kad god želite. Potreban je Premium.", "donuyor": "Gotovo. Povratak na vaš AI…", "sureDoldu": "Kod je istekao. Ponovno pokrenite povezivanje s In1 u svojem AI-ju.", "bitti": "Ovaj zahtjev za povezivanje je dovršen. Možete zatvoriti stranicu.", "yok": "Zahtjev za povezivanje nije pronađen ili je istekao. Ponovno pokrenite povezivanje s In1 u svojem AI-ju.", "hata": "Ovaj zahtjev za povezivanje nije se mogao otvoriti. In1 se zasad povezuje samo s Claudeom i ChatGPT-jem.", "agYok": "Poslužitelj nije dostupan, pokušava se ponovno…", "gizlilik": "Pravila privatnosti"},
    "sr": {"baslik": "Повезивање са In1", "bilgisayar": "Апликација на овом рачунару", "istiyor": "{k} жели да се повеже са вашим In1 налогом.", "adim1": "Отворите In1 на телефону.", "adim2": "У одељку ВИ тренер додирните назив своје ВИ, затим „Како се повезати“.", "adim3": "Унесите код испод и дозволите приступ.", "sure": "Код важи још {s}. Када дозволите, ова страница се сама враћа.", "uyari": "Ако ову страницу нисте сами отворили, код не уносите нигде. In1 никада не тражи овај код поруком ни телефоном.", "bilgi": "Повезана ВИ види спискове вежби и намирница и оставља вам предлоге програма, рецепата, јеловника и циљева макронутријената. Не може да мења ваше записе; предлог не постаје ништа док га не додате у апликацији. Чита само податке које засебно дозволите за ову везу у апликацији (подаци о исхрани, сажеци тренинга, телесне мере, праћење макронутријената, рецепти, сопствене намирнице, расподела по мишићима, историја вежби, пол-узраст-висина-тежина, циљ-искуство-место-опрема, подаци о боловима и повредама: сваки има свој прекидач, на почетку су сви искључени). Везу можете прекинути у апликацији кад год желите. Потребан је Premium.", "donuyor": "Готово. Повратак на вашу ВИ…", "sureDoldu": "Код је истекао. Поново покрените повезивање са In1 у својој ВИ.", "bitti": "Овај захтев за повезивање је завршен. Можете затворити страницу.", "yok": "Захтев за повезивање није пронађен или је истекао. Поново покрените повезивање са In1 у својој ВИ.", "hata": "Овај захтев за повезивање није могао да се отвори. In1 се за сада повезује само са Claude и ChatGPT.", "agYok": "Сервер није доступан, покушава се поново…", "gizlilik": "Политика приватности"},
    "sr-latn": {"baslik": "Povezivanje sa In1", "bilgisayar": "Aplikacija na ovom računaru", "istiyor": "{k} želi da se poveže sa vašim In1 nalogom.", "adim1": "Otvorite In1 na telefonu.", "adim2": "U odeljku VI trener dodirnite naziv svoje VI, zatim „Kako se povezati“.", "adim3": "Unesite kod ispod i dozvolite pristup.", "sure": "Kod važi još {s}. Kada dozvolite, ova stranica se sama vraća.", "uyari": "Ako ovu stranicu niste sami otvorili, kod ne unosite nigde. In1 nikada ne traži ovaj kod porukom ni telefonom.", "bilgi": "Povezana VI vidi spiskove vežbi i namirnica i ostavlja vam predloge programa, recepata, jelovnika i ciljeva makronutrijenata. Ne može da menja vaše zapise; predlog ne postaje ništa dok ga ne dodate u aplikaciji. Čita samo podatke koje zasebno dozvolite za ovu vezu u aplikaciji (podaci o ishrani, sažeci treninga, telesne mere, praćenje makronutrijenata, recepti, sopstvene namirnice, raspodela po mišićima, istorija vežbi, pol-uzrast-visina-težina, cilj-iskustvo-mesto-oprema, podaci o bolovima i povredama: svaki ima svoj prekidač, na početku su svi isključeni). Vezu možete prekinuti u aplikaciji kad god želite. Potreban je Premium.", "donuyor": "Gotovo. Povratak na vašu VI…", "sureDoldu": "Kod je istekao. Ponovo pokrenite povezivanje sa In1 u svojoj VI.", "bitti": "Ovaj zahtev za povezivanje je završen. Možete zatvoriti stranicu.", "yok": "Zahtev za povezivanje nije pronađen ili je istekao. Ponovo pokrenite povezivanje sa In1 u svojoj VI.", "hata": "Ovaj zahtev za povezivanje nije mogao da se otvori. In1 se za sada povezuje samo sa Claude i ChatGPT.", "agYok": "Server nije dostupan, pokušava se ponovo…", "gizlilik": "Politika privatnosti"},
    "el": {"baslik": "Σύνδεση με το In1", "bilgisayar": "Μια εφαρμογή σε αυτόν τον υπολογιστή", "istiyor": "{k}: ζητά σύνδεση με τον λογαριασμό σας στο In1.", "adim1": "Ανοίξτε το In1 στο τηλέφωνό σας.", "adim2": "Στην ενότητα «Προπονητής» πατήστε το όνομα της ΤΝ σας και μετά «Τρόπος σύνδεσης».", "adim3": "Πληκτρολογήστε τον παρακάτω κωδικό και παραχωρήστε πρόσβαση.", "sure": "Ο κωδικός ισχύει για {s} ακόμη. Μόλις παραχωρήσετε πρόσβαση, η σελίδα επιστρέφει μόνη της.", "uyari": "Αν δεν ανοίξατε εσείς αυτή τη σελίδα, μην πληκτρολογήσετε τον κωδικό πουθενά. Το In1 δεν ζητά ποτέ αυτόν τον κωδικό με μήνυμα ή τηλεφωνικά.", "bilgi": "Η συνδεδεμένη ΤΝ βλέπει τις λίστες ασκήσεων και τροφίμων και σας αφήνει προτάσεις προγραμμάτων, συνταγών, διαιτολογίων και στόχων μακροθρεπτικών. Δεν μπορεί να αλλάξει τις καταγραφές σας· μια πρόταση δεν γίνεται τίποτα μέχρι να την προσθέσετε στην εφαρμογή. Διαβάζει μόνο τις πληροφορίες που επιτρέπετε χωριστά για αυτή τη σύνδεση στην εφαρμογή (πληροφορίες διατροφής, συνόψεις προπονήσεων, σωματικές μετρήσεις, παρακολούθηση μακροθρεπτικών, συνταγές, δικά σας τρόφιμα, κατανομή μυών, ιστορικό ασκήσεων, φύλο-ηλικία-ύψος-βάρος, στόχος-εμπειρία-χώρος-εξοπλισμός, πληροφορίες για πόνους και τραυματισμούς: η καθεμία με δικό της διακόπτη, όλες κλειστές στην αρχή). Μπορείτε να διακόψετε τη σύνδεση από την εφαρμογή όποτε θέλετε. Απαιτείται Premium.", "donuyor": "Έγινε. Επιστροφή στην ΤΝ σας…", "sureDoldu": "Ο κωδικός έληξε. Ξεκινήστε ξανά τη σύνδεση με το In1 στην ΤΝ σας.", "bitti": "Αυτό το αίτημα σύνδεσης ολοκληρώθηκε. Μπορείτε να κλείσετε τη σελίδα.", "yok": "Το αίτημα σύνδεσης δεν βρέθηκε ή έληξε. Ξεκινήστε ξανά τη σύνδεση με το In1 στην ΤΝ σας.", "hata": "Δεν ήταν δυνατό να ανοίξει αυτό το αίτημα σύνδεσης. Προς το παρόν το In1 συνδέεται μόνο με το Claude και το ChatGPT.", "agYok": "Δεν υπάρχει πρόσβαση στον διακομιστή, γίνεται νέα προσπάθεια…", "gizlilik": "Πολιτική απορρήτου"},
    "sq": {"baslik": "Lidhu me In1", "bilgisayar": "Një aplikacion në këtë kompjuter", "istiyor": "{k} kërkon të lidhet me llogarinë tënde In1.", "adim1": "Hap In1 në telefon.", "adim2": "Te Trajner AI, prek emrin e AI-së tënde, pastaj «Si lidhet».", "adim3": "Shkruaj kodin më poshtë dhe lejo.", "sure": "Kodi vlen edhe {s}. Sapo të lejosh, kjo faqe kthehet vetë.", "uyari": "Nëse këtë faqe nuk e ke hapur ti, mos e shkruaj kodin askund. In1 nuk e kërkon kurrë këtë kod me mesazh ose me telefon.", "bilgi": "AI-ja e lidhur sheh listat e ushtrimeve dhe të ushqimeve dhe të lë sugjerime programesh, recetash, dietash dhe objektivash makro. Nuk i ndryshon dot të dhënat e tua; një sugjerim nuk bëhet asgjë derisa ta shtosh në aplikacion. Lexon vetëm informacionin që lejon veçmas për këtë lidhje në aplikacion (informacioni i ushqyerjes, përmbledhjet e stërvitjeve, matjet e trupit, ndjekja e makrove, recetat, ushqimet e tua, shpërndarja e muskujve, historiku i ushtrimeve, gjinia-mosha-gjatësia-pesha, qëllimi-përvoja-vendi-pajisjet, informacioni për dhimbjet dhe dëmtimet: secili me çelësin e vet, të gjithë të fikur në fillim). Lidhjen mund ta ndërpresësh në aplikacion kur të duash. Kërkohet Premium.", "donuyor": "U krye. Po kthehesh tek AI-ja jote…", "sureDoldu": "Kodi ka skaduar. Nise sërish lidhjen me In1 në AI-në tënde.", "bitti": "Kjo kërkesë lidhjeje përfundoi. Mund ta mbyllësh faqen.", "yok": "Kërkesa e lidhjes nuk u gjet ose ka skaduar. Nise sërish lidhjen me In1 në AI-në tënde.", "hata": "Kjo kërkesë lidhjeje nuk u hap dot. Tani për tani In1 lidhet vetëm me Claude dhe ChatGPT.", "agYok": "Serveri nuk arrihet, po provohet sërish…", "gizlilik": "Politika e privatësisë"},
    "hu": {"baslik": "Csatlakozás az In1-hez", "bilgisayar": "Egy alkalmazás ezen a számítógépen", "istiyor": "{k} csatlakozni szeretne az In1-fiókodhoz.", "adim1": "Nyisd meg az In1-et a telefonodon.", "adim2": "Az AI edző részben koppints a saját AI-od nevére, majd a „Csatlakozás módja” pontra.", "adim3": "Írd be az alábbi kódot, és engedélyezd.", "sure": "A kód még {s} ideig érvényes. Amint engedélyezed, ez az oldal magától visszatér.", "uyari": "Ha nem te nyitottad meg ezt az oldalt, ne írd be a kódot sehová. Az In1 soha nem kéri ezt a kódot üzenetben vagy telefonon.", "bilgi": "A csatlakoztatott AI látja a gyakorlatok és az ételek listáját, és program-, recept-, étrend- és makrócél-javaslatokat hagy neked. A bejegyzéseidet nem tudja módosítani; a javaslatból semmi sem lesz, amíg hozzá nem adod az alkalmazásban. Csak azokat az adatokat olvassa, amelyeket ehhez a kapcsolathoz külön engedélyezel az alkalmazásban (táplálkozási adatok, edzés-összefoglalók, testméretek, makrókövetés, receptek, saját ételek, izomeloszlás, gyakorlatelőzmények, nem-kor-magasság-testsúly, cél-tapasztalat-helyszín-eszközök, fájdalomra és sérülésre vonatkozó adatok: mindegyiknek saját kapcsolója van, kezdetben mind ki van kapcsolva). A kapcsolatot az alkalmazásban bármikor megszakíthatod. Premium szükséges.", "donuyor": "Kész. Visszatérés az AI-odhoz…", "sureDoldu": "A kód lejárt. Indítsd újra az In1-kapcsolatot az AI-odban.", "bitti": "Ez a csatlakozási kérés lezárult. Bezárhatod az oldalt.", "yok": "A csatlakozási kérés nem található, vagy lejárt. Indítsd újra az In1-kapcsolatot az AI-odban.", "hata": "Ezt a csatlakozási kérést nem sikerült megnyitni. Az In1 egyelőre csak a Claude-dal és a ChatGPT-vel kapcsolódik.", "agYok": "A szerver nem érhető el, újrapróbálkozás…", "gizlilik": "Adatvédelmi szabályzat"},
    "ja": {"baslik": "In1と連携", "bilgisayar": "このパソコン上のアプリ", "istiyor": "{k} がIn1アカウントとの連携を求めています。", "adim1": "スマートフォンでIn1を開きます。", "adim2": "「AIコーチ」でお使いのAIの名前をタップし、「連携方法」をタップします。", "adim3": "下のコードを入力して許可します。", "sure": "コードの有効時間は残り {s} です。許可すると、このページは自動的に戻ります。", "uyari": "このページをご自身で開いていない場合は、コードをどこにも入力しないでください。In1がメッセージや電話でこのコードを尋ねることはありません。", "bilgi": "連携したAIは種目リストと食品リストを見て、プログラム、レシピ、食事プラン、マクロ目標の提案を残します。記録を変更することはできず、提案はアプリで追加するまで何にもなりません。読み取れるのは、アプリでこの連携に対して個別に許可した情報だけです（栄養情報、トレーニングの概要、身体測定、マクロの記録、レシピ、自分の食品、筋肉の配分、種目の履歴、性別・年齢・身長・体重、目標・経験・場所・器具、痛みやけがの情報。それぞれに専用のスイッチがあり、最初はすべてオフです）。連携はアプリからいつでも解除できます。Premiumが必要です。", "donuyor": "完了しました。お使いのAIに戻ります…", "sureDoldu": "コードの有効期限が切れました。お使いのAIでIn1との連携をやり直してください。", "bitti": "この連携リクエストは完了しました。ページを閉じてかまいません。", "yok": "連携リクエストが見つからないか、有効期限が切れています。お使いのAIでIn1との連携をやり直してください。", "hata": "この連携リクエストを開けませんでした。現在In1が連携できるのはClaudeとChatGPTのみです。", "agYok": "サーバーに接続できません。再試行しています…", "gizlilik": "プライバシーポリシー"},
    "ko": {"baslik": "In1에 연결", "bilgisayar": "이 컴퓨터의 앱", "istiyor": "{k}: In1 계정 연결을 요청했어요.", "adim1": "휴대폰에서 In1을 열어요.", "adim2": "‘AI 코치’에서 사용하는 AI의 이름을 누른 뒤 ‘연결 방법’을 눌러요.", "adim3": "아래 코드를 입력하고 허용해요.", "sure": "코드는 앞으로 {s} 동안 유효해요. 허용하면 이 페이지가 자동으로 돌아가요.", "uyari": "이 페이지를 직접 열지 않았다면 코드를 어디에도 입력하지 마세요. In1은 메시지나 전화로 이 코드를 묻지 않아요.", "bilgi": "연결된 AI는 운동 목록과 식품 목록을 보고 프로그램, 레시피, 식단, 매크로 목표 제안을 남겨요. 기록을 바꿀 수는 없고, 제안은 앱에서 추가하기 전에는 아무것도 되지 않아요. 앱에서 이 연결에 따로 허용한 정보만 읽어요(영양 정보, 운동 요약, 신체 측정, 매크로 기록, 레시피, 내 식품, 근육 분포, 운동 기록, 성별·나이·키·몸무게, 목표·경험·장소·기구, 통증과 부상 정보. 각각 스위치가 따로 있고 처음에는 모두 꺼져 있어요). 연결은 앱에서 언제든 끊을 수 있어요. Premium이 필요해요.", "donuyor": "완료했어요. 사용하는 AI로 돌아가는 중…", "sureDoldu": "코드가 만료됐어요. 사용하는 AI에서 In1 연결을 다시 시작해 주세요.", "bitti": "이 연결 요청은 완료됐어요. 페이지를 닫아도 돼요.", "yok": "연결 요청을 찾을 수 없거나 만료됐어요. 사용하는 AI에서 In1 연결을 다시 시작해 주세요.", "hata": "이 연결 요청을 열 수 없어요. 지금은 In1이 Claude와 ChatGPT에만 연결돼요.", "agYok": "서버에 연결할 수 없어 다시 시도하는 중…", "gizlilik": "개인정보 처리방침"},
    "zh": {"baslik": "連結 In1", "bilgisayar": "這台電腦上的應用程式", "istiyor": "{k} 想連結你的 In1 帳號。", "adim1": "在手機上開啟 In1。", "adim2": "在「AI教練」中點選你的AI名稱，再點「連結方式」。", "adim3": "輸入下方代碼並允許。", "sure": "代碼還有 {s} 有效。你允許後，這個頁面會自動返回。", "uyari": "如果這個頁面不是你自己開啟的，請不要在任何地方輸入代碼。In1 絕不會透過訊息或電話向你索取這組代碼。", "bilgi": "已連結的AI可以查看動作清單和食物清單，並留下訓練計畫、食譜、飲食計畫與巨量營養素目標的建議。它無法更改你的紀錄；在你於應用程式中加入之前，建議不會變成任何東西。它只能讀取你在應用程式中為這個連結另外允許的資訊（營養資訊、訓練摘要、身體測量、巨量營養素追蹤、食譜、自訂食物、肌群分配、動作紀錄、性別-年齡-身高-體重、目標-經驗-地點-器材、疼痛與傷病資訊：每項都有各自的開關，一開始全部關閉）。你可以隨時在應用程式中中斷連結。需要 Premium。", "donuyor": "完成。正在返回你的AI…", "sureDoldu": "代碼已過期。請在你的AI中重新開始 In1 連結。", "bitti": "這個連結請求已完成。你可以關閉頁面。", "yok": "找不到連結請求，或請求已過期。請在你的AI中重新開始 In1 連結。", "hata": "無法開啟這個連結請求。目前 In1 只能與 Claude 和 ChatGPT 連結。", "agYok": "無法連上伺服器，正在重試…", "gizlilik": "隱私權政策"},
    "id": {"baslik": "Hubungkan ke In1", "bilgisayar": "Aplikasi di komputer ini", "istiyor": "{k} ingin terhubung ke akun In1-mu.", "adim1": "Buka In1 di ponselmu.", "adim2": "Di Pelatih AI, ketuk nama AI-mu, lalu “Cara menghubungkan”.", "adim3": "Masukkan kode di bawah lalu izinkan.", "sure": "Kode masih berlaku selama {s}. Setelah kamu mengizinkan, halaman ini kembali dengan sendirinya.", "uyari": "Kalau bukan kamu yang membuka halaman ini, jangan masukkan kode di mana pun. In1 tidak pernah meminta kode ini lewat pesan atau telepon.", "bilgi": "AI yang terhubung melihat daftar gerakan dan makanan lalu meninggalkan saran program, resep, rencana makan, dan target makro. AI tidak bisa mengubah catatanmu; saran tidak menjadi apa-apa sampai kamu menambahkannya di aplikasi. AI hanya membaca info yang kamu izinkan secara terpisah untuk koneksi ini di aplikasi (info nutrisi, ringkasan latihan, ukuran tubuh, pelacakan makro, resep, makanan sendiri, pembagian otot, riwayat gerakan, jenis kelamin-usia-tinggi-berat, tujuan-pengalaman-tempat-alat, info nyeri dan cedera: masing-masing punya sakelar sendiri, semuanya mati di awal). Kamu bisa memutus koneksi di aplikasi kapan saja. Perlu Premium.", "donuyor": "Selesai. Kembali ke AI-mu…", "sureDoldu": "Kode sudah kedaluwarsa. Mulai lagi koneksi In1 di AI-mu.", "bitti": "Permintaan koneksi ini sudah selesai. Kamu boleh menutup halaman.", "yok": "Permintaan koneksi tidak ditemukan atau sudah kedaluwarsa. Mulai lagi koneksi In1 di AI-mu.", "hata": "Permintaan koneksi ini tidak bisa dibuka. Untuk saat ini In1 hanya terhubung dengan Claude dan ChatGPT.", "agYok": "Server tidak terjangkau, mencoba lagi…", "gizlilik": "Kebijakan Privasi"}
  };

  // DİL (14 Kasım 2026, borç 263): uygulamanın 25 dili. Tarayıcının dil sırasındaki İLK tanınan dil seçilir; hiçbiri
  // tanınmıyorsa İngilizce. Brezilya Portekizcesi ve Latin harfli Sırpça ayrı dildir (uygulamadaki gibi); Çincenin
  // her türü Geleneksel Çinceye düşer (uygulamada tek Çince o). Menü ve düğme adları uygulamadaki adlarla AYNI yazıldı
  // (YzMetinleri*.kt: baslik · saglayiciNasilBaglanir) — uygulamada ad değişirse burada da değişir.
  function dilSec() {
    var liste = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
    for (var n = 0; n < liste.length; n++) {
      var etiket = String(liste[n] || '').toLowerCase();
      var ana = etiket.split('-')[0];
      var kod = etiket === 'pt-br' ? 'pt-br' : (ana === 'sr' && etiket.indexOf('latn') > 0) ? 'sr-latn' : ana;
      if (Object.prototype.hasOwnProperty.call(DILLER, kod)) return kod;
    }
    return 'en';
  }
  var DIL = dilSec();
  var Y = DILLER[DIL];
  var M = {
    baslik: Y.baslik,
    kim: { CLAUDE: 'Claude', CHATGPT: 'ChatGPT', BILGISAYAR: Y.bilgisayar },
    istiyor: function (k) { return Y.istiyor.replace('{k}', k); },
    adim1: Y.adim1, adim2: Y.adim2, adim3: Y.adim3,
    sure: function (s) { return Y.sure.replace('{s}', s); },
    uyari: Y.uyari, bilgi: Y.bilgi, donuyor: Y.donuyor, sureDoldu: Y.sureDoldu, bitti: Y.bitti, yok: Y.yok,
    hata: Y.hata, agYok: Y.agYok, gizlilik: Y.gizlilik,
    // Gizlilik Politikası iki dilde yayında: Türkçe (asıl) ve İngilizce (çeviri).
    gizlilikAdresi: DIL === 'tr' ? './' : './en/'
  };

  var el = function (id) { return document.getElementById(id); };
  document.documentElement.lang = { pt: 'pt-PT', 'pt-br': 'pt-BR', sr: 'sr-Cyrl', 'sr-latn': 'sr-Latn', zh: 'zh-Hant' }[DIL] || DIL;
  if (DIL === 'ar') document.documentElement.dir = 'rtl';
  document.title = M.baslik;
  el('baslik').textContent = M.baslik;
  el('adim1').textContent = M.adim1;
  el('adim2').textContent = M.adim2;
  el('adim3').textContent = M.adim3;
  el('uyari').textContent = M.uyari;
  el('bilgi').textContent = M.bilgi;
  el('gizlilik').textContent = M.gizlilik;
  el('gizlilik').href = M.gizlilikAdresi;

  function bitir(metin) {
    el('bekleme').hidden = true;
    el('durum').textContent = metin;
    try { sessionStorage.removeItem('in1_istek'); } catch (e) { /* depolama kapalı olabilir */ }
    durdu = true;
  }

  // İsteğin kimliği adresin # kısmında gelir; alınır alınmaz adres çubuğundan silinir (geçmişte kalmasın).
  // Sayfa yenilenirse kimlik bu sekmenin oturum deposundan okunur.
  var KIMLIK = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
  var parca = location.hash.replace(/^#/, '');
  var istek = null;
  var durdu = false;
  if (parca.indexOf('i=') === 0) istek = parca.slice(2);
  if (parca) { try { history.replaceState(null, '', location.pathname); } catch (e) { /* önemli değil */ } }
  if (istek && KIMLIK.test(istek)) {
    try { sessionStorage.setItem('in1_istek', istek); } catch (e) { /* depolama kapalı olabilir */ }
  } else if (parca.indexOf('hata=') === 0) {
    istek = null;
  } else {
    try { istek = sessionStorage.getItem('in1_istek'); } catch (e) { istek = null; }
    if (!istek || !KIMLIK.test(istek)) istek = null;
  }
  if (parca.indexOf('hata=') === 0) { bitir(M.hata); return; }
  if (!istek) { bitir(M.yok); return; }

  // Geri dönülecek adres sunucudan gelir (sunucu onu sabit listeden doğrular); burada bir kez daha bakılır.
  function guvenilirMi(adres) {
    return /^https:\/\/(claude\.ai|claude\.com|chatgpt\.com)\//.test(adres) || /^http:\/\/(localhost|127\.0\.0\.1)(:\d{1,5})?\/callback\?/.test(adres);
  }

  var kalan = 0;
  var sayac = null;
  function sureYaz() {
    var dk = Math.floor(kalan / 60), sn = kalan % 60;
    el('sure').textContent = M.sure(dk + ':' + (sn < 10 ? '0' : '') + sn);
  }
  function sayaciKur(saniye) {
    kalan = Math.max(0, saniye | 0);
    sureYaz();
    if (sayac) return;
    sayac = setInterval(function () { if (kalan > 0) { kalan--; sureYaz(); } }, 1000);
  }

  var hataSayisi = 0;
  var baslangic = Date.now();
  function yokla() {
    if (durdu) return;
    if (Date.now() - baslangic > 16 * 60 * 1000) { bitir(M.sureDoldu); return; }
    fetch(PRIZ + '/istek?i=' + encodeURIComponent(istek), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('durum ' + r.status); return r.json(); })
      .then(function (d) {
        hataSayisi = 0;
        if (d.durum === 'BEKLIYOR' && /^[A-HJ-NP-Z2-9]{8}$/.test(d.kod || '')) {
          el('kim').textContent = M.istiyor(M.kim[d.kim] || M.kim.BILGISAYAR);
          el('kod').textContent = d.kod.slice(0, 4) + '-' + d.kod.slice(4);
          el('bekleme').hidden = false;
          el('durum').textContent = '';
          sayaciKur(d.kalan);
          setTimeout(yokla, 3000);
        } else if (d.durum === 'DON' && typeof d.adres === 'string' && guvenilirMi(d.adres)) {
          bitir(M.donuyor);
          location.replace(d.adres);
        } else if (d.durum === 'SURE_DOLDU') {
          bitir(M.sureDoldu);
        } else if (d.durum === 'BITTI') {
          bitir(M.bitti);
        } else {
          bitir(M.yok);
        }
      })
      .catch(function () {
        hataSayisi++;
        if (hataSayisi >= 3) el('durum').textContent = M.agYok;
        setTimeout(yokla, 5000);
      });
  }
  yokla();
})();
</script>
